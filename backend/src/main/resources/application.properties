        # Server Port and Context Path
        server.port=8085
        server.servlet.context-path=/api

        # MySQL Database Configuration
        spring.datasource.url=jdbc:mysql://localhost:3306/edubridge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        spring.datasource.username=root
        spring.datasource.password=password
        spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

        # JPA / Hibernate Configurations
        spring.jpa.hibernate.ddl-auto=update
        spring.sql.init.mode=always
        spring.jpa.defer-datasource-initialization=true
        spring.jpa.show-sql=true
        spring.jpa.properties.hibernate.format_sql=true
        spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

        # JWT Configurations
        edubridge.jwt.secret=================EduBridgeSecretKeyJwtTokenSecureHashKey2026=================
        edubridge.jwt.expirationMs=86400000

        # Swagger / OpenAPI configurations
        springdoc.api-docs.path=/api-docs
        springdoc.swagger-ui.path=/swagger-ui.html
        springdoc.swagger-ui.operationsSorter=alpha
